<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}

.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {

	}

.leaflet-container .leaflet-shadow-pane img,

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}

}
.leaflet-container a {

}

	}

/* control positioning */

.leaflet-control {

	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

.leaflet-top {

.leaflet-bottom {
	bottom: 0;

.leaflet-fade-anim .leaflet-popup {

	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {

	        transform-origin: 0 0;
	}

	will-change: transform;
}

	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

.leaflet-zoom-anim .leaflet-tile,

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {

<style>/* ==========================================================================
   Гуанчжоу — интерактивная карта путешественника
   ========================================================================== */
:root {
  --red: #d6273b;          /* лычи-красный, «кантонский» акцент */
  --red-dark: #a81a2b;
  --jade: #0f9d78;         /* нефрит — второстепенный акцент */
  --gold: #e8a838;
  --ink: #1a1a1e;
  --ink-soft: #4a4a55;
  --muted: #8a8a97;
  --line: #e6e6ec;
  --bg: #f5f5f7;
  --card: #ffffff;
  --shadow: 0 2px 8px rgba(20,20,30,.08), 0 8px 28px rgba(20,20,30,.10);
  --shadow-lg: 0 12px 44px rgba(20,20,30,.22);
  --radius: 14px;
  --radius-sm: 9px;
  --sidebar-w: 380px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--red-dark); }

/* ---------- Каркас ---------- */
#app { display: flex; height: 100vh; height: 100dvh; }

/* ---------- Сайдбар ---------- */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100%;
  background: var(--card);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  z-index: 1200;
  box-shadow: 2px 0 16px rgba(20,20,30,.04);
}
.brand {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  color: #fff;
}
.brand h1 { font-size: 19px; margin: 0; letter-spacing: .2px; display: flex; align-items: center; gap: 9px; }
.brand .flag { font-size: 22px; }
.brand p { margin: 4px 0 0; font-size: 12.5px; opacity: .9; }

/* Табы */
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; background: var(--card); border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; padding: 9px 6px; border: none; background: transparent; color: var(--muted);
  font-size: 13px; font-weight: 600; border-radius: 8px 8px 0 0; position: relative; transition: color .15s;
}
.tab.active { color: var(--red); }
.tab.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px;
  background: var(--red); border-radius: 3px;
}
.tab:hover { color: var(--ink); }

.credit { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 11px; color: var(--muted); background: #fafafb; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.credit b { color: var(--ink-soft); }
.soc-links { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.soc { display: inline-flex; line-height: 0; border-radius: 6px; }
.soc svg { display: block; transition: transform .12s; }
.soc:hover svg { transform: scale(1.12); }

.panel { display: none; flex: 1; overflow-y: auto; padding: 12px; }
.panel.active { display: block; }
.panel::-webkit-scrollbar { width: 9px; }
.panel::-webkit-scrollbar-thumb { background: #d5d5dd; border-radius: 8px; border: 2px solid var(--card); }

/* Поездка */
#trip { margin-bottom: 14px; background: linear-gradient(135deg, #fff, #fff5f6); border: 1px solid #f3d6da; border-radius: 12px; padding: 11px 11px 12px; }
.trip-head { font-size: 13px; color: var(--ink-soft); margin-bottom: 9px; }
.trip-head b { color: var(--red); }
.trip-chips { display: flex; gap: 5px; }
.trip-chip { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.trip-chip .tc-dow { font-size: 12px; font-weight: 800; color: var(--ink); }
.trip-chip .tc-d { font-size: 10px; color: var(--muted); }
.trip-chip.we .tc-dow { color: var(--red); }

/* Погода */

}
.wx-m { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.wx-t { display: flex; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800; }
.wx-day { color: #e8590c; }
.wx-night { color: #1c7ed6; }
.wx-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }
.wx-note { font-size: 11.5px; color: var(--ink-soft); margin: 9px 2px 0; line-height: 1.45; }
.wx-trip { font-size: 12px; color: var(--ink); background: #eef6ff; border: 1px solid #cfe4fb; border-radius: 9px; padding: 8px 10px; margin-top: 9px; line-height: 1.4; }

/* Фильтры-чипы */
.filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }

/* Карточки списка */
.list-item {
  display: flex; gap: 11px; padding: 11px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  margin-bottom: 9px; background: #fff; transition: all .15s; cursor: pointer; align-items: flex-start;
}
.list-item:hover { border-color: var(--red); box-shadow: var(--shadow); transform: translateY(-1px); }

.eye-btn { align-self: center; border: 1.5px solid var(--line); background: #fff; width: 34px; height: 34px; min-width: 34px;
  border-radius: 9px; font-size: 15px; line-height: 1; color: var(--ink-soft); }
.eye-btn.on { border-color: var(--red); background: #fff5f6; }
.eye-btn:hover { border-color: var(--red); }
.hotels-toggle { width: 100%; padding: 8px; margin: 2px 0 10px; border: 1px dashed var(--line); background: #fafafb; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.hotels-toggle:hover { border-color: var(--red); color: var(--red); }
.li-price { font-size: 12px; margin-top: 4px; color: var(--ink-soft); }
.li-price b { color: var(--jade); }
.cmp-btn { width: 100%; padding: 10px; margin: 4px 0 6px; border: none; background: var(--ink); color: #fff; border-radius: 10px; font-size: 13px; font-weight: 700; }
.cmp-btn:hover { background: #000; }

/* Модалка сравнения отелей */
#cmp-modal { display: none; position: fixed; inset: 0; z-index: 3200; align-items: center; justify-content: center; }
#cmp-modal .cmp-back { position: absolute; inset: 0; background: rgba(20,20,30,.55); }
#cmp-modal .cmp-card { position: relative; z-index: 1; background: #fff; border-radius: 16px; width: min(760px, 94vw); max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.cmp-head { padding: 14px 16px; font-size: 16px; font-weight: 800; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.cmp-x { border: none; background: #f0f0f4; width: 30px; height: 30px; border-radius: 8px; font-size: 18px; color: var(--ink-soft); }
.cmp-x:hover { background: var(--red); color: #fff; }
.cmp-sum { padding: 11px 16px; font-size: 12.5px; line-height: 1.7; background: #fafafb; border-bottom: 1px solid var(--line); }
.cmp-scroll { overflow: auto; }
.cmp-tbl { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 620px; }
.cmp-tbl th, .cmp-tbl td { padding: 8px 9px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.cmp-tbl th { position: sticky; top: 0; background: #fff; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; z-index: 1; }

.cmp-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.cmp-tbl td.cmp-metro { text-align: left; font-size: 11px; color: var(--ink-soft); min-width: 130px; }
.cmp-tbl td.hl-green { background: rgba(15,157,120,.14); font-weight: 800; color: #0b6e53; }

/* Калькулятор билетов */
.tk-head { font-size: 15px; font-weight: 800; margin: 2px 2px 10px; }
.tk-ppl-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.tk-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
.tk-item { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
.tk-lbl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.tk-lbl input { width: 17px; height: 17px; accent-color: var(--red); }
.tk-sel { width: 100%; margin-top: 7px; padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 12.5px; font-family: inherit; background: #fff; }
.tk-line { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.tk-line b { white-space: nowrap; color: var(--ink); }
.tk-empty { font-size: 12.5px; color: var(--muted); padding: 8px 0; }
.tk-grand { margin-top: 10px; padding: 11px; background: var(--jade); color: #fff; border-radius: 10px; font-size: 14px; font-weight: 700; }
.tk-grand b { font-size: 17px; }
.tk-usd { opacity: .9; font-weight: 600; font-size: 12px; }

/* Даты поездки (календарь) / праздники / сворачивание разделов */
.trip-dates { display: flex; gap: 8px; margin: 6px 0 9px; }
.trip-dates label { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; flex: 1; }
.trip-dates input[type=date] { flex: 1; min-width: 0; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 12.5px; background: #fff; color: var(--ink); }
.trip-chip.hol { border-color: #ffb3ba; }
.trip-chip.hol .tc-dow { color: #c92a2a; }
.trip-chip.hol.active { background: #c92a2a; border-color: #c92a2a; }
.trip-chip.hol.active .tc-dow, .trip-chip.hol.active .tc-d { color: #fff; }
.trip-note.hol { color: #c92a2a; background: #fff0f0; }
.collapsible { cursor: pointer; user-select: none; }
.sec-chev { display: inline-block; transition: transform .15s; font-size: 10px; opacity: .7; margin-right: 2px; }
.collapsed .sec-chev { transform: rotate(-90deg); }

/* ==================== Ночная тема ==================== */
:root.dark { color-scheme: dark; --bg: #0f1117; --card: #191c24; --ink: #e9e9f0; --ink-soft: #b9bac6; --muted: #7f8194; --line: #2b2f3a; }
:root.dark body { background: var(--bg); }
:root.dark #sidebar { background: var(--card); border-right-color: var(--line); }
:root.dark .tabs { background: var(--card); border-bottom-color: var(--line); }
:root.dark .chip, :root.dark .list-item, :root.dark .phrase, :root.dark .tr-mode, :root.dark .mo-origin,
:root.dark .tk-sel, :root.dark .pt-sel, :root.dark .pt-calc, :root.dark .tk-item, :root.dark .ppl-b, :root.dark .eye-btn, :root.dark .hotels-toggle,
:root.dark .phrase-search, :root.dark .trip-chip, :root.dark .speak, :root.dark .trip-dates input[type=date],
:root.dark .copy-btn { background: #20242e; color: var(--ink); border-color: var(--line); }
:root.dark .tr-row { background: #20242e; border-color: var(--line); }
:root.dark .list-item.dimmed { background: #171a21; }
:root.dark .wx-card { background: linear-gradient(160deg, #20242e, #191c24); border-color: var(--line); }
:root.dark #trip { background: linear-gradient(135deg, #20242e, #241a1d); border-color: #3a2a2e; }
:root.dark .combo-box, :root.dark .ag-term, :root.dark .wx-trip { background: #132132; border-color: #25405e; }
:root.dark .hc-tip, :root.dark .ag-lvl { background: #2a2410; color: var(--ink-soft); }
:root.dark .hc-free { background: rgba(15,157,120,.18); }
:root.dark .credit { background: #171a21; }
:root.dark .cmp-card, :root.dark .nav-card { background: var(--card); color: var(--ink); }
:root.dark .cmp-sum, :root.dark .cmp-head, :root.dark .cmp-tbl th { background: var(--card); }
:root.dark .cmp-x { background: #2b2f3a; color: var(--ink); }
:root.dark .map-btn, :root.dark .layer-switch, :root.dark .layer-switch button, :root.dark .mobile-bar { background: #191c24; color: var(--ink); border-color: var(--line); }
:root.dark .layer-switch button.active { background: var(--red); color: #fff; }
:root.dark .marker-label { background: rgba(25,28,36,.95); color: var(--ink); border-color: rgba(255,255,255,.12); }
:root.dark .tr-mode:hover { background: #2a1f22; }
:root.dark select option { background: #20242e; color: var(--ink); }
:root.dark .trip-note.hol, :root.dark .hc-golden { background: #2a1416; }
.li-pin {
  width: 34px; height: 34px; min-width: 34px; border-radius: 9px; display: grid; place-items: center;
  font-size: 17px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.li-body { flex: 1; min-width: 0; }
.li-title { font-size: 14px; font-weight: 700; line-height: 1.25; }
.li-zh { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
.li-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.li-rating { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--jade); }
.stars { color: var(--gold); letter-spacing: -1px; }

.section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 6px 2px 9px; }
.group-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin: 12px 2px 8px; display: flex; align-items: center; gap: 7px; }
.group-label:first-child { margin-top: 2px; }
.grp-badge { font-size: 10px; font-weight: 700; color: var(--jade); background: rgba(15,157,120,.1); padding: 2px 7px; border-radius: 20px; text-transform: none; letter-spacing: 0; }

/* Разговорник */
.phrase-search {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 13.5px;
  margin-bottom: 10px; outline: none;
}
.phrase-search:focus { border-color: var(--red); }
.phrase-cat { font-size: 12px; font-weight: 800; color: var(--red); text-transform: uppercase; letter-spacing: .5px; margin: 14px 2px 7px; }
.phrase {

}

.phrase .zh { font-size: 17px; margin: 2px 0; color: var(--ink); }

.phrase .speak {

  font-size: 15px; color: var(--ink-soft);
}

/* ---------- Карта ---------- */
#map-wrap { flex: 1; position: relative; }
#map { position: absolute; inset: 0; background: #dfe6e9; }

/* Кнопки управления картой */
.map-controls { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
.layer-switch {
  display: flex; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.layer-switch button {
  border: none; background: #fff; padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  border-right: 1px solid var(--line);
}
.layer-switch button:last-child { border-right: none; }
.layer-switch button.active { background: var(--red); color: #fff; }
.map-btn {
  width: 40px; height: 40px; border-radius: 10px; background: #fff; border: 1px solid var(--line);
  box-shadow: var(--shadow); font-size: 18px; display: grid; place-items: center; color: var(--ink);
}
.map-btn:hover { background: var(--red); color: #fff; }
.map-btn.active { background: var(--jade); color: #fff; }
.map-btn-txt { font-size: 13px; font-weight: 800; letter-spacing: .5px; }

/* Русские подписи районов/локаций */
.area-label { transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; font-weight: 700;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
.area-label.district { font-size: 12.5px; text-transform: uppercase; letter-spacing: 1px; color: #7a6a55; }
.area-label.area { font-size: 12px; color: #33342f; }
.area-label.water { font-size: 12px; font-style: italic; font-weight: 600; color: #2f6fb0; }

.area-label.park { font-size: 12px; color: #2b8a3e; }

/* Отзывчивость зума: ускоряем анимацию Leaflet (по умолч. 0.25s) */
.leaflet-zoom-anim .leaflet-zoom-animated { transition: transform .15s cubic-bezier(0,0,.25,1) !important; }
.leaflet-fade-anim .leaflet-tile { transition: opacity .12s linear !important; }

/* Окно выбора приложения (Google / Amap) */
#nav-modal { display: none; position: fixed; inset: 0; z-index: 3000; align-items: center; justify-content: center; }
#nav-modal .nav-back { position: absolute; inset: 0; background: rgba(20,20,30,.5); }
#nav-modal .nav-card { position: relative; background: #fff; border-radius: 16px; padding: 18px; width: min(340px, 88vw);
  box-shadow: var(--shadow-lg); z-index: 1; }

  padding: 13px; border-radius: 11px; font-size: 14.5px; font-weight: 700; margin-bottom: 9px; }

#nav-modal .nav-opt.a { background: #00a0e9; color: #fff; }
#nav-modal .nav-opt.a:hover { background: #008fd0; }
#nav-modal .nav-opt.d { background: #ff7a00; color: #fff; }
#nav-modal .nav-opt.d:hover { background: #ec6f00; }
#nav-modal .nav-hint { font-size: 11px; color: var(--muted); text-align: center; margin: 2px 0 10px; line-height: 1.4; }
#nav-modal .nav-cancel { width: 100%; padding: 11px; border: none; background: #f0f0f4; color: var(--ink-soft);
  border-radius: 11px; font-size: 13.5px; font-weight: 700; margin-top: 2px; }
#nav-modal .nav-cancel:hover { background: #e3e3ea; }

/* Часы работы метро в маршрутном листе */
.metro-hours { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
.mh-h { font-size: 12.5px; font-weight: 800; margin-bottom: 8px; }
.mh-row { display: flex; align-items: center; gap: 7px; font-size: 12px; margin: 4px 0; }
.mh-row .line-badge { min-width: 30px; height: 20px; font-size: 11px; }
.mh-st { font-size: 12px; color: var(--ink-soft); margin: 4px 0; }
.mh-st b { color: var(--ink); }

/* Маркеры (DivIcon) */
.pin {
  width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 2.5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); display: grid; place-items: center;
  position: relative;
}
.pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
.pin.big { width: 38px; height: 38px; }
.pin.big span { font-size: 18px; }
.pin.selected { z-index: 999 !important; animation: pop .3s ease; }
@keyframes pop { 0%{transform:rotate(-45deg) scale(.6);} 60%{transform:rotate(-45deg) scale(1.15);} 100%{transform:rotate(-45deg) scale(1);} }
.marker-label {
  display: none;
  position: absolute; left: 50%; top: 33px; transform: translateX(-50%); white-space: nowrap;
  background: rgba(255,255,255,.96); padding: 2px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700;
  box-shadow: 0 1px 5px rgba(0,0,0,.28); pointer-events: none; color: var(--ink); border: 1px solid rgba(0,0,0,.06);
  max-width: 160px; overflow: hidden; text-overflow: ellipsis;
}
/* показ подписи: у выбранной точки, по наведению, и в режиме «все названия» */
.pin-wrap.labeled .marker-label,
.pin-wrap:hover .marker-label,
.leaflet-container.labels-all .marker-label { display: block; }
.pin-wrap.labeled { z-index: 1000 !important; }
.pin-wrap.labeled .marker-label { background: var(--ink); color: #fff; border-color: var(--ink); }
.me-dot { width: 18px; height: 18px; background: #2d7dff; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 4px rgba(45,125,255,.25), 0 2px 6px rgba(0,0,0,.3); }

/* ---------- Панель детали (bottom sheet / side) ---------- */
#detail {
  position: absolute; top: 12px; left: 12px; width: 384px; max-height: calc(100% - 24px);
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  z-index: 1100; display: none; flex-direction: column; overflow: hidden; animation: slideIn .25s ease;
}
#detail.open { display: flex; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.d-head { padding: 15px 16px 13px; color: #fff; position: relative; }
.d-close {
  position: absolute; top: 11px; right: 11px; width: 30px; height: 30px; border-radius: 8px; border: none;
  background: rgba(255,255,255,.22); color: #fff; font-size: 17px;
}
.d-close:hover { background: rgba(255,255,255,.4); }
.d-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; opacity: .9; }
.d-title { font-size: 19px; font-weight: 800; margin: 3px 0 0; line-height: 1.2; padding-right: 34px; }
.d-zh { font-size: 20px; margin-top: 6px; font-weight: 500; display: flex; align-items: center; gap: 8px; }

.zh-txt, .d-title, .d-pin-ru, .phrase .zh, .phrase .tr, .li-zh {

}
.copy-btn {

  border-radius: 7px; font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
}
.copy-btn:hover { background: rgba(255,255,255,.4); }
.copy-btn.ok { background: var(--jade); }
.phrase .copy-btn { float: right; margin-right: 6px; background: #f0f0f4; color: var(--ink-soft); }
.phrase .copy-btn:hover, .phrase .copy-btn.ok { background: var(--jade); color: #fff; }
.grp-ic { font-size: 14px; }
.d-pin-ru { font-size: 13px; opacity: .92; margin-top: 2px; }
.d-body { padding: 14px 16px; overflow-y: auto; }
.d-row { display: flex; gap: 8px; align-items: baseline; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.d-row .k { color: var(--muted); min-width: 74px; font-weight: 600; }
.d-row .v { flex: 1; }
.rating-badge { display: inline-block; background: var(--jade); color: #fff; font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 7px; margin-right: 6px; }
.me-badge { display: inline-block; background: #d6273b; color: #fff; font-weight: 700; font-size: 10.5px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }

.d-actions { display: flex; gap: 8px; margin: 13px 0 4px; flex-wrap: wrap; }
.d-btn {
  flex: 1; min-width: 120px; text-align: center; padding: 10px; border-radius: 10px; border: none; font-size: 13px;
  font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.d-btn.primary { background: var(--red); color: #fff; }
.d-btn.primary:hover { background: var(--red-dark); }
.d-btn.ghost { background: #f0f0f4; color: var(--ink); }
.d-btn.ghost:hover { background: #e3e3ea; }

/* Матрица времени в пути — карточки */
.travel-h { font-size: 13px; font-weight: 800; margin: 16px 0 9px; display: flex; align-items: center; gap: 6px; }
.travel-list { display: flex; flex-direction: column; gap: 7px; }
.tr-row { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fafafb; }
.tr-dest { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.tr-dest b { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tr-modes { display: flex; flex-wrap: wrap; gap: 6px; }
.tr-mode {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 8px;
  background: #fff; border: 1px solid var(--line); font-size: 12px; text-decoration: none; color: var(--ink);
}
.tr-mode:hover { border-color: var(--red); background: #fff5f6; }
.tr-mode .t { font-weight: 700; }
.tr-mode .arr { color: var(--muted); font-size: 11px; }
.est-note { font-size: 10.5px; color: var(--muted); margin-top: 9px; line-height: 1.4; }

/* Часы работы и загруженность */
.hc-hours { display: flex; align-items: baseline; gap: 8px; font-size: 13px; padding: 4px 0; }
.hc-hours span { color: var(--muted); min-width: 74px; font-weight: 600; font-size: 12px; }
.hc-hours b { font-size: 13.5px; }
.hc-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 9px 0 4px; }
.hc-tbl th, .hc-tbl td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.hc-tbl th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; }
.hc-tbl td:first-child { font-weight: 600; }
.hc-tbl td:not(:first-child), .hc-tbl th:not(:first-child) { text-align: center; }
.hc-free { font-size: 12.5px; color: var(--jade); font-weight: 700; background: rgba(15,157,120,.08); border-radius: 8px; padding: 8px 10px; margin: 8px 0 4px; }
.hc-line { font-size: 12px; color: var(--ink-soft); margin: 6px 0; }
.hc-golden { font-size: 12px; font-weight: 600; color: #c92a2a; background: #fff0f0; border: 1px solid #ffd0d0; border-radius: 8px; padding: 8px 10px; margin: 8px 0; line-height: 1.4; }
.hc-tip { font-size: 12px; color: var(--ink-soft); background: #fff8e6; border-radius: 8px; padding: 8px 10px; margin: 7px 0; line-height: 1.4; }
.combo-box { background: #f0f7ff; border: 1px solid #cfe4fb; border-radius: 10px; padding: 9px 11px; margin: 9px 0; }
.combo-h { font-size: 12px; font-weight: 800; color: #1c5fa8; margin-bottom: 6px; }
.combo-it { font-size: 12px; color: var(--ink); margin: 5px 0; line-height: 1.45; }
.combo-note { font-size: 11px; color: var(--ink-soft); margin-top: 7px; font-style: italic; }
.combo-price { font-weight: 800; color: var(--jade); white-space: nowrap; }
.combo-sub { font-size: 11px; color: var(--ink-soft); margin-top: 1px; line-height: 1.4; }

/* Подсказка по аэропорту (зона DiDi) */
.airport-guide { margin-top: 16px; }
.ag-h { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
.ag-term { font-size: 12px; background: #eef6ff; border: 1px solid #cfe4fb; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; line-height: 1.45; }
.ag-warn { color: #c92a2a; }
.ag-lvl { font-size: 12px; background: #fff8e6; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.45; }
.ag-steps { margin: 0 0 12px; padding-left: 20px; font-size: 12.5px; color: var(--ink); line-height: 1.5; }
.ag-steps li { margin: 4px 0; }
.ag-signs-h { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
.ag-signs { display: flex; flex-direction: column; gap: 6px; }
.ag-sign { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 8px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.ag-sign .ag-ar { font-size: 22px; font-weight: 800; min-width: 24px; text-align: center; }
.ag-sign .ag-ic { margin-left: auto; font-size: 20px; }
.ag-cn { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
.ag-en { font-size: 10.5px; opacity: .9; text-transform: uppercase; letter-spacing: .5px; }
.ag-sign.go { background: #0b7a4b; }
.ag-sign.no { background: #c99a06; }
.ag-sign.park { background: #1a4f8a; }
.ag-cap { font-size: 12px; margin: -1px 0 6px; padding-left: 4px; color: var(--ink-soft); }
.ag-cap.go { color: #0b7a4b; font-weight: 700; }
.ag-cap.no { color: #a86a00; font-weight: 600; }
.hc-yourday { font-size: 12.5px; font-weight: 600; color: #0b6e53; background: rgba(15,157,120,.1); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.hc-yourday b { color: var(--jade); }
.hc-muted { font-size: 11px; color: var(--muted); margin: 7px 0; line-height: 1.4; }
.hc-muted b { color: var(--ink-soft); }
.hc-tbl .hl { background: rgba(214,39,59,.07); }
.hc-tbl th.hl { color: var(--red); }

/* Метро — маршрутный лист */
.metro-ctrls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.mc-row { display: flex; align-items: center; gap: 9px; }
.mc-lbl { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 92px; }
.mo-origin { flex: 1; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 9px; font-size: 13px; font-family: inherit; background: #fff; outline: none; }
.mo-origin:focus { border-color: var(--red); }
.ppl { display: inline-flex; align-items: center; gap: 4px; }
.ppl-b { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-size: 16px; font-weight: 700; color: var(--ink); line-height: 1; }
.ppl-b:hover { border-color: var(--red); color: var(--red); }
.ppl b { min-width: 22px; text-align: center; font-size: 15px; }
.ppl-note { font-size: 10.5px; color: var(--muted); margin-left: 8px; }
.didi-tbl td:last-child { text-align: right; white-space: nowrap; }
.didi-tbl td:last-child b { color: var(--jade); }

/* Кнопка «Заказать в DiDi» с уже выбранной конечной точкой */
.didi-order { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  margin: 10px 0 4px; padding: 12px 14px; border-radius: 11px; background: #ff7a00; color: #fff;
  font-size: 14.5px; font-weight: 800; text-decoration: none; box-shadow: 0 2px 8px rgba(255,122,0,.3); }
.didi-order:hover { background: #ec6f00; }
.didi-order .do-sub { font-size: 11px; font-weight: 600; opacity: .95; }

/* Калькулятор билетов в панели точки */
.pt-calc { border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin: 9px 0; }
.pt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.pt-lbl { font-size: 13px; font-weight: 700; color: var(--ink); }
.pt-sel { flex: 1; max-width: 62%; padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 8px;
  font-size: 12.5px; font-family: inherit; background: #fff; color: var(--ink); }

/* Пульсация кнопки озвучки во время речи */
.phrase .speak.speaking { background: var(--red); color: #fff; animation: speakPulse .9s ease-in-out infinite; }
@keyframes speakPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,48,49,.5); } 50% { box-shadow: 0 0 0 6px rgba(214,48,49,0); } }
.mr-head { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 10px; }
.mr-hint { font-size: 12.5px; color: var(--ink-soft); background: #f4f7fb; border: 1px dashed var(--line); border-radius: 10px; padding: 11px; line-height: 1.45; }
.metro-steps { position: relative; padding-left: 6px; }
.mr-step { display: flex; gap: 9px; align-items: center; padding: 5px 0; }
.mr-step .mr-ic { font-size: 17px; width: 24px; text-align: center; }
.mr-step b { font-size: 12.5px; }
.mr-sub { font-size: 12px; color: var(--ink-soft); }
.st-en { color: var(--muted); font-size: 11px; }
.mr-seg { display: flex; gap: 9px; align-items: center; padding: 8px 10px; margin: 5px 0 5px 4px; border-left: 3px solid var(--line); background: #fafafb; border-radius: 0 9px 9px 0; }
.line-badge { min-width: 34px; height: 24px; padding: 0 7px; border-radius: 7px; color: #fff; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.mr-seg-txt b { font-size: 13px; }
.mr-transfer { font-size: 12px; font-weight: 600; color: var(--red-dark); padding: 4px 0 4px 8px; }
.mr-totals { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 4px; }
.mr-tot { flex: 1; min-width: 70px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 6px; text-align: center; background: #fff; }
.mr-tot span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.mr-tot b { font-size: 14px; }
.mr-tot.hl { background: var(--jade); border-color: var(--jade); }
.mr-tot.hl span, .mr-tot.hl b { color: #fff; }
.mr-note { font-size: 11.5px; color: var(--red-dark); background: #fff5f6; border-radius: 8px; padding: 8px 10px; margin-top: 9px; line-height: 1.4; }
.mr-cur { font-size: 11.5px; color: var(--ink-soft); margin-top: 7px; }
.mr-cur b { color: var(--jade); }

/* Рестораны рядом */
.near-rest { margin-top: 15px; }
.near-item { display: flex; gap: 8px; align-items: center; padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 12.5px;
  cursor: pointer; border-radius: 8px; transition: background .12s; }
.near-item:hover { background: #fff5f6; }
:root.dark .near-item:hover { background: #2a1f22; }
.near-item .rr { background: var(--gold); color: #fff; font-weight: 800; font-size: 11px; padding: 1px 6px; border-radius: 6px; }

/* Магазины рядом с отелем */
.nsh-cat { font-size: 11.5px; font-weight: 800; color: #7c3aed; margin: 10px 2px 5px; }
.nsh-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.nsh-b { flex: 1; min-width: 0; }
.nsh-zh { color: var(--muted); font-size: 12px; }
.nsh-m { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Мобильное меню */
.mobile-bar { display: none; }

/* ---------- Адаптив ---------- */
@media (max-width: 860px) {
  :root { --sidebar-w: 100%; }
  #app { flex-direction: column; }
  #sidebar {
    position: fixed; inset: 0; transform: translateX(-100%); transition: transform .28s ease; min-width: 0;
  }
  #sidebar.open { transform: none; }
  #map-wrap { flex: 1; height: 100%; }
  .mobile-bar {
    display: flex; position: absolute; top: 10px; left: 10px; right: 62px; z-index: 900; gap: 8px; align-items: center;
    background: #fff; border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow);
  }
  .mobile-bar .menu-btn { border: none; background: transparent; font-size: 20px; }
  .mobile-bar .mb-title { font-size: 14px; font-weight: 800; color: var(--red); }
  #detail { width: auto; left: 8px; right: 8px; top: auto; bottom: 8px; max-height: 72%; }
  .map-controls { top: 62px; }
  .sidebar-close { display: block !important; }
  /* Безопасные зоны (чёлка / нижняя полоса) в установленном PWA */
  html.standalone .mobile-bar { top: calc(10px + env(safe-area-inset-top)); }
  html.standalone .map-controls { top: calc(62px + env(safe-area-inset-top)); }
  html.standalone .sidebar-close { top: calc(14px + env(safe-area-inset-top)); }
  html.standalone #sidebar { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  html.standalone #detail { bottom: calc(8px + env(safe-area-inset-bottom)); max-height: calc(72% - env(safe-area-inset-bottom)); }
}

/* Подсказка режима «указать себя вручную» */
#geo-hint {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top));
  z-index: 3500; display: none; align-items: center; gap: 10px;
  background: #2d7dff; color: #fff; padding: 10px 12px 10px 14px; border-radius: 12px;
  box-shadow: 0 6px 22px rgba(0,0,0,.28); font-size: 13px; font-weight: 600; max-width: 92vw;
}
#geo-hint button {
  border: none; background: rgba(255,255,255,.25); color: #fff; width: 24px; height: 24px;
  border-radius: 7px; font-size: 16px; line-height: 1; flex: none; cursor: pointer;
}

/* Баннер «Установите как приложение» (iOS Safari) */
.ios-install {
  position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 4000;
  display: flex; align-items: center; gap: 11px; padding: 13px 40px 13px 13px;
  background: linear-gradient(135deg, var(--jade, #0f9d78), #0b7d5f); color: #fff;
  border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
  opacity: 0; transform: translateY(22px); transition: opacity .3s, transform .3s; pointer-events: none;
}
.ios-install.show { opacity: 1; transform: none; pointer-events: auto; }
.ios-install .ios-ic { font-size: 30px; line-height: 1; flex: none; }
.ios-install .ios-tx { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.35; }
.ios-install .ios-tx b { font-weight: 800; }
.ios-install .ios-tx span { opacity: .95; font-weight: 500; }
.ios-install .ios-x {
  position: absolute; top: 7px; right: 9px; border: none; background: rgba(255,255,255,.22); color: #fff;
  width: 26px; height: 26px; border-radius: 8px; font-size: 17px; line-height: 1; cursor: pointer;
}
.ios-install .ios-x:hover { background: rgba(255,255,255,.35); }
.sidebar-close {
  display: none; position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,.25);
  border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; font-size: 18px; z-index: 5;
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <button id="sidebar-close" class="sidebar-close">×</button>
      <h1><span class="flag">🏮</span> Гуанчжоу · 广州</h1>
      <p>Карта путешественника: отели, места, рестораны, маршруты и разговорник</p>
    </div>
    <div class="tabs">
      <button class="tab active" data-panel="explore">🧭 Обзор</button>
      <button class="tab" data-panel="tickets">🎟️ Билеты</button>
      <button class="tab" data-panel="phrases">💬 Разговорник</button>
    </div>
    <div id="panel-explore" class="panel active">
      <input id="global-search" class="phrase-search" placeholder="🔎 Поиск: отели, места, магазины, рестораны…" oninput="__search(this.value)">
      <div id="search-rest"></div>
      <div id="trip"></div>
      <div id="weather"></div>
      <div class="filters">
        <button class="chip" data-cat="hotel"><span class="dot" style="background:#d6273b"></span>Отели</button>
        <button class="chip" data-cat="attraction"><span class="dot" style="background:#0f9d78"></span>Туристические места</button>
        <button class="chip" data-cat="shop"><span class="dot" style="background:#7c3aed"></span>Шопинг</button>
        <button class="chip" data-cat="food"><span class="dot" style="background:#e8a838"></span>Рестораны</button>
      </div>
      <div class="section-label collapsible" onclick="__collapse(this)"><span class="sec-chev">▾</span> 🏨 Отели</div>
      <div id="list-hotels"></div>
      <div class="section-label collapsible" onclick="__collapse(this)"><span class="sec-chev">▾</span> 📍 Достопримечательности</div>
      <div id="list-places"></div>
      <div class="section-label collapsible" onclick="__collapse(this)"><span class="sec-chev">▾</span> 🛍️ Шопинг и скидки</div>
      <div id="list-shops"></div>
    </div>
    <div id="panel-tickets" class="panel">
      <div id="tickets"></div>
    </div>
    <div id="panel-phrases" class="panel">
      <input id="phrase-search" class="phrase-search" placeholder="🔎 Поиск фразы (напр. «остро», «счёт»)">
      <div id="phrases"></div>
    </div>
    <div class="credit">
      <span>Разработчик: <b>Илья Кузнецов</b></span>
      <span class="soc-links">
        <a class="soc" href="https://t.me/ilyankuznetsov" target="_blank" rel="noopener" title="Telegram @ilyankuznetsov" aria-label="Telegram">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="11" fill="#29A9EB"/><path fill="#fff" d="M17.9 7.2l-2 9.3c-.15.66-.55.82-1.1.51l-3.05-2.25-1.47 1.42c-.16.16-.3.3-.62.3l.22-3.13 5.7-5.15c.25-.22-.05-.34-.38-.12l-7.04 4.43-3.03-.95c-.66-.2-.67-.66.14-.98l11.83-4.56c.55-.2 1.03.13.85.98z"/></svg>
        </a>
        <a class="soc" href="https://instagram.com/k_ilia_n_" target="_blank" rel="noopener" title="Instagram @k_ilia_n_" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="ig-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".45" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="1" y="1" width="22" height="22" rx="6" fill="url(#ig-grad)"/><rect x="5" y="5" width="14" height="14" rx="4.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="16.7" cy="7.3" r="1.1" fill="#fff"/></svg>
        </a>
      </span>
    </div>
  </aside>

  <div id="map-wrap">
    <div class="mobile-bar">
      <button id="menu-btn" class="menu-btn">☰</button>
      <span class="mb-title">🏮 Гуанчжоу</span>
    </div>
    <div id="map"></div>
    <div class="map-controls">
      <div class="layer-switch">
        <button data-base="voyager" class="active">Схема</button>
        <button data-base="sat">Спутник</button>
      </div>
      <button id="btn-geo" class="map-btn" title="Моё местоположение">📍</button>
      <button id="btn-fit" class="map-btn" title="Показать все точки">🗺️</button>
      <button id="btn-labels" class="map-btn" title="Показать/скрыть все названия">🏷️</button>
      <button id="btn-areas" class="map-btn map-btn-txt" title="Русские подписи районов">РУ</button>
      <button id="btn-dark" class="map-btn" title="Ночная / дневная тема">🌙</button>
    </div>
    <div id="detail"></div>
  </div>
</div>

<script>/* @preserve
 * Leaflet 1.9.4, a JS library for interactive maps. https://leafletjs.com

    var wk = (day && day.weekend) ? "weekend" : "weekday";
    var html = '<div class="travel-h" style="margin-top:16px">🕐 Часы работы и загруженность</div>';
    if (info.hours) {
      html += '<div class="hc-hours"><span>🏛️ Часы</span><b>' + info.hours.text + '</b></div>';
      if (info.hours.tickets) html += '<div class="hc-hours"><span>🎫 Билеты</span><b>' + info.hours.tickets + '</b></div>';
    }
    if (info.combo) {
      var cb = info.combo;
      html += '<div class="combo-box">';
      if (cb.singles && cb.singles.length) {
        html += '<div class="combo-h">🎫 Одиночные билеты</div>';
        cb.singles.forEach(function (s) {
          html += '<div class="combo-it"><b>' + s.name + '</b> — <span class="combo-price">' + convStr(s.price) + '</span>' + (s.desc ? ' · ' + s.desc : '') + '</div>';
        });
      }
      if (cb.combos && cb.combos.length) {
        html += '<div class="combo-h" style="margin-top:9px">🎟️ Комбо-билеты (что входит)</div>';
        cb.combos.forEach(function (c) {
          html += '<div class="combo-it"><b>' + c.name + '</b> — <span class="combo-price">' + convStr(c.price) + '</span><div class="combo-sub">' + c.desc + '</div></div>';
        });
      }
      // старый формат (items) — на случай, если где-то остался
      if (cb.items && cb.items.length) {
        html += '<div class="combo-h">🎟️ Комбо-билет' + (cb.price ? ' ' + cb.price : '') + ' — что входит:</div>';
        cb.items.forEach(function (it) { html += '<div class="combo-it"><b>' + it.name + '</b> — ' + it.desc + '</div>'; });
      }
      if (cb.note) html += '<div class="combo-note">' + cb.note + '</div>';
      html += '</div>';
    }
    var c = info.crowd;
    if (c) {
      // предупреждение про понедельник для детского парка
      if (o.id === "children" && day && day.monday)
        html += '<div class="hc-golden">⚠️ ' + day.d + ' — понедельник: парк может быть закрыт на техобслуживание. Уточните заранее или перенесите визит.</div>';

      if (c.free) {
        html += '<div class="hc-free">✅ ' + (c.freeText || "Вход свободный — очередей нет") + '</div>';
        if (day) html += '<div class="hc-yourday">📅 Ваш день (<b>' + day.dow + ' ' + day.d + '</b>' + (day.weekend ? ", выходной" : "") + '): вход свободный' + (day.weekend ? ", будет оживлённее обычного" : ", спокойно") + '</div>';
      } else {
        if (day) {
          var parts = [];
          if (c.entry)  parts.push("🚪 вход ~" + c.entry[wk]);
          if (c.ticket) parts.push("🎫 касса ~" + c.ticket[wk]);
          html += '<div class="hc-yourday">📅 Ваш день (<b>' + day.dow + ' ' + day.d + '</b>, ' + (day.weekend ? "выходной" : "будни") + '): ' + parts.join(" · ") + '</div>';
        }
        var wCls = (day && !day.weekend) ? ' class="hl"' : '';
        var eCls = (day && day.weekend) ? ' class="hl"' : '';
        html += '<table class="hc-tbl"><thead><tr><th>Очередь</th><th' + wCls + '>Будни</th><th' + eCls + '>Сб–Вс</th></tr></thead><tbody>';
        if (c.entry)  html += '<tr><td>🚪 Вход</td><td' + wCls + '>' + c.entry.weekday + '</td><td' + eCls + '>' + c.entry.weekend + '</td></tr>';
        if (c.ticket) html += '<tr><td>🎫 Касса</td><td' + wCls + '>' + c.ticket.weekday + '</td><td' + eCls + '>' + c.ticket.weekend + '</td></tr>';
        html += '</tbody></table>';
      }
      if (c.peak)   html += '<div class="hc-line">📈 Пик: ' + c.peak + '</div>';
      if (c.golden) {
        if (day && day.holiday) html += '<div class="hc-golden">🔴 ' + day.holiday + ' (' + day.d + ') — ожидается ПИК: ' + c.golden + '</div>';
        else html += '<div class="hc-muted">🎏 В китайские праздники здесь пик (' + c.golden + '). В выбранные даты праздников нет — <b>не актуально</b>.</div>';
      }
      if (c.tip)    html += '<div class="hc-tip">💡 ' + c.tip + '</div>';
    }
    html += '<div class="est-note">Часы работы — по открытым источникам (могут меняться). Очереди — оценка на выбранный день поездки по типу дня (будни/выходной) и загруженности; не гарантия.</div>';
    return html;
  }

    '</div>';

  function nearbyShopsHtml(h) {
    var list = NEARBY[h.id];
    if (!list || !list.length) return "";
    var from = [h.lat, h.lng];
    var order = [], by = {};
    list.forEach(function (s) { if (!by[s.type]) { by[s.type] = []; order.push(s.type); } by[s.type].push(s); });
    var html = '<div class="travel-h" style="margin-top:16px">🛍️ Магазины рядом (в пешей доступности)</div>';
    order.forEach(function (t) {
      html += '<div class="nsh-cat">' + t + '</div>';
      by[t].sort(function (a, b) { return haversine(from, [a.lat, a.lng]) - haversine(from, [b.lat, b.lng]); }).forEach(function (s) {
        var d = haversine(from, [s.lat, s.lng]);
        var dist = d < 1 ? Math.round(d * 1000) + " м" : d.toFixed(1) + " км";
        html += '<div class="nsh-item"><div class="nsh-b"><b>' + s.name_ru + '</b>' +
          (s.zh ? ' <span class="nsh-zh zh-txt">' + s.zh + '</span>' : '') +
          '<div class="nsh-m">' + (s.note ? s.note + ' · ' : '') + '~' + dist + '</div></div>' +
          '<a class="route-link" href="#" onclick="' + navAttr({ tLat: s.lat, tLng: s.lng, name: (s.name_en || s.name_ru) }) + '">↗</a></div>';
      });
    });
    if (NEARBY_NOTE[h.id]) html += '<div class="hc-muted">ℹ️ ' + NEARBY_NOTE[h.id] + '</div>';
    html += '<div class="est-note">Расстояние по прямой от отеля; реальный пеший путь чуть длиннее. ↗ — открыть в Google/Amap.</div>';
    return html;
  }

  function openDetail(type, id, noFly) {
    var isHotel = type === "hotel";
    var o = (isHotel ? HOTELS : PLACES).filter(function (x){ return x.id === id; })[0];
    if (!o) return;
    var color = isHotel ? CATS.hotel.color : (o.color || CATS.attraction.color);
    var kicker = isHotel ? ("Отель" + (o.stars ? " · " + "★".repeat(o.stars) : "")) : (o.kicker || "Достопримечательность");
    var name = isHotel ? o.name : o.name_ru;

    var head = '<div class="d-head" style="background:linear-gradient(135deg,' + color + ',' + shade(color) + ')">' +
      '<button class="d-close" onclick="__closeDetail()">×</button>' +
      '<div class="d-kicker">' + kicker + '</div>' +
      '<div class="d-title">' + name + '</div>' +
      '<div class="d-zh"><span class="zh-txt">' + (o.zh || "") + '</span>' + copyBtn(o.zh) + '</div>' +
      '<div class="d-pin-ru">' + (o.pinyin ? o.pinyin + " · " : "") + '<b>' + (o.ru || "") + '</b></div>' +
      '</div>';

    var rows = "";
    if (isHotel && o.rating && o.rating.length) rows += drow("Рейтинг", ratingHtml(o.rating));
    if (isHotel && o.price) rows += drow("Цена/ночь", '<b>' + convStr(o.price) + '</b>');
    if (isHotel && o.breakfast) rows += drow("Завтрак", (o.breakfastIncl ? "✅ " : "") + o.breakfast);
    if (isHotel && o.family3) rows += drow("Семья 3 чел.", (o.familyGood ? "👨‍👩‍👧 " : "") + o.family3);
    if (isHotel && o.metro) rows += drow("Метро", o.metro);
    if (o.district) rows += drow("Район", o.district);
    if (o.address) rows += drow("Адрес", o.address);
    if (o.about) rows += drow("Кратко", o.about);
    if (o.site) rows += drow("Сайт", '<a href="' + o.site + '" target="_blank">' + prettyUrl(o.site) + '</a>');

    var actions = '<div class="d-actions">' +
      '<a class="d-btn primary" href="#" onclick="' + navAttr({ tLat: o.lat, tLng: o.lng, name: (o.name_en || name) }) + '">🗺️ Открыть на картах</a>' +
      (o.site ? '<a class="d-btn ghost" target="_blank" href="' + o.site + '">🌐 Сайт</a>' : '') +
      '</div>';

    curDestId = isHotel ? null : id;
    var hours = '<div id="hc-block">' + hoursCrowdHtml(o) + '</div>' + (id === "airport" ? airportGuideHtml() : "");
    var ticket = isHotel ? "" : placeTicketHtml(o.id);
    var travel = isHotel ? travelTableFromHotel(o) : travelTableFromPlace(o);
    var metro = isHotel ? "" : metroSheetHtml();
    var near = nearRestHtml(o.lat, o.lng);

    var nearby = isHotel ? nearbyShopsHtml(o) : "";
    detail.innerHTML = head + '<div class="d-body">' + '<div class="d-rows">' + rows + '</div>' + actions + nearby + hours + ticket + travel + metro + near + '</div>';
    if (ticket) window.__ptCalc();
    detail.classList.add("open");
    highlight(type, id);
    if (!noFly) map.flyTo([o.lat, o.lng], Math.max(map.getZoom(), 15), { duration: .35 });
  }

  function openRest(r) {
    var color = CATS.food.color;
    var head = '<div class="d-head" style="background:linear-gradient(135deg,' + color + ',' + shade(color) + ')">' +
      '<button class="d-close" onclick="__closeDetail()">×</button>' +
      '<div class="d-kicker">Ресторан · ' + (r.cuisine || "") + '</div>' +
      '<div class="d-title">' + r.name_ru + '</div>' +
      '<div class="d-zh"><span class="zh-txt">' + (r.zh || "") + '</span>' + copyBtn(r.zh) + '</div></div>';
    var rows = "";
    if (r.rating) rows += drow("Рейтинг", '<span class="rating-badge" style="background:var(--gold)">' + r.rating + '</span> ' + (r.ratingSrc||"") + (r.mustEat ? ' <span class="me-badge">🏅 必吃榜 Must-Eat</span>' : ""));
    if (r.avg)  rows += drow("Средний чек", '<b>' + convStr(r.avg) + '</b>');
    if (r.dish) rows += drow("Популярное", convStr(r.dish));
    if (r.note) rows += drow("Кратко", r.note);
    if (r.zone) rows += drow("Зона", r.zoneLabel || r.zone);
    var actions = '<div class="d-actions"><a class="d-btn primary" href="#" onclick="' +
      navAttr({ tLat: r.lat, tLng: r.lng, name: (r.name_en || r.name_ru) }) + '">🗺️ Открыть на картах</a></div>';
    detail.innerHTML = head + '<div class="d-body">' + rows + actions + '</div>';
    detail.classList.add("open");
    var idx = RESTAURANTS.indexOf(r);
    if (idx >= 0) {
      var mk = markerById["food:" + idx];
      if (mk && !map.hasLayer(mk)) mk.addTo(map);   // показать пин, даже если слой ресторанов был скрыт
      highlight("food", idx);
    }
    map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 15), { duration: .35 });
  }

  function drow(k, v) { return '<div class="d-row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
  function prettyUrl(u) { return u.replace(/^https?:\/\//,"").replace(/\/$/,"").slice(0,38); }
  function shade(hex) {
    var n = parseInt(hex.slice(1),16), r=(n>>16)-28, g=((n>>8)&255)-24, b=(n&255)-24;
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  window.__closeDetail = function () { detail.classList.remove("open"); clearHighlight(); };

  var selKey = null;
  function markerKey(type, id) { return (type === "hotel" ? "hotel" : type === "food" ? "food" : "attraction") + ":" + id; }
  function highlight(type, id) {
    clearHighlight();
    var k = markerKey(type, id);
    var m = markerById[k];
    if (m) {
      var el = m.getElement();
      if (el) { el.classList.add("labeled"); var pin = el.querySelector(".pin"); if (pin) pin.classList.add("selected"); }
      m.setZIndexOffset(1000);
      selKey = k;
    }
  }
  function clearHighlight() {
    if (selKey && markerById[selKey]) {
      var m = markerById[selKey], el = m.getElement();
      if (el){ el.classList.remove("labeled"); var p=el.querySelector(".pin"); if(p) p.classList.remove("selected"); }
    }
    selKey = null;
  }

  /* ---------------- Списки в сайдбаре ---------------- */
  function hotelCard(h) {
    var vis = hotelVisible[h.id];
    var meta = (h.stars ? '<span class="stars">' + "★".repeat(h.stars) + '</span>' : "") +
      (h.rating && h.rating[0] ? ' <span class="li-rating">▲ ' + h.rating[0].score + '</span>' : "") +
      (h.district ? ' · ' + h.district : "");
    return '<div class="list-item hotel-item' + (vis ? '' : ' dimmed') + '" data-type="hotel" data-id="' + h.id + '">' +
      '<div class="li-pin" style="background:' + CATS.hotel.color + '"><span>🏨</span></div>' +
      '<div class="li-body"><div class="li-title">' + h.name + '</div>' +
        (h.zh ? '<div class="li-zh">' + h.zh + '</div>' : '') +
        '<div class="li-meta">' + meta + '</div>' +
        (h.price ? '<div class="li-price">💰 <b>' + convStr(h.price) + '</b>' + (h.breakfastIncl ? ' · 🍳 завтрак' : '') + '</div>' : '') +
      '</div>' +
      '<button class="eye-btn' + (vis ? ' on' : '') + '" data-hid="' + h.id + '" title="' +
        (vis ? 'Показан на карте — скрыть' : 'Скрыт — показать') + '">' + (vis ? '👁' : '🚫') + '</button>' +
      '</div>';
  }
  function renderHotelList() {
    var hEl = document.getElementById("list-hotels");
    var vis = HOTELS.filter(function (h) { return hotelVisible[h.id]; });
    var hidden = HOTELS.filter(function (h) { return !hotelVisible[h.id]; });
    var html = vis.map(hotelCard).join("");
    if (hidden.length) {
      html += '<button class="hotels-toggle" onclick="__toggleHotelsList()">' +
        (showAllHotels ? '▴ Скрыть другие отели' : '▾ Другие отели (' + hidden.length + ') — показать') + '</button>';
      if (showAllHotels) html += hidden.map(hotelCard).join("");
    }
    html += '<button class="cmp-btn" onclick="__compareHotels()">📊 Сравнить все отели</button>';
    hEl.innerHTML = html;
    hEl.querySelectorAll(".hotel-item").forEach(function (el) {
      el.addEventListener("click", function () {
        openDetail("hotel", el.dataset.id);
        if (window.innerWidth <= 860) document.getElementById("sidebar").classList.remove("open");
      });
    });
    hEl.querySelectorAll(".eye-btn").forEach(function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); window.__hotel(b.dataset.hid); });
    });
  }
  window.__toggleHotelsList = function () { showAllHotels = !showAllHotels; renderHotelList(); };
  // Сворачивание раздела: прячет следующий за заголовком блок
  window.__collapse = function (el) {
    var n = el.nextElementSibling; if (!n) return;
    var c = el.classList.toggle("collapsed");
    n.style.display = c ? "none" : "";
  };

  /* ---------------- Глобальный поиск по точкам ---------------- */
  window.__openRestIdx = function (i) { if (RESTAURANTS[i]) openRest(RESTAURANTS[i]); if (window.innerWidth <= 860) document.getElementById("sidebar").classList.remove("open"); };
  window.__search = function (val) {
    var q = (val || "").trim().toLowerCase();
    var by = {};
    HOTELS.forEach(function (h) { by[h.id] = (h.name + " " + (h.short||"") + " " + (h.name_en||"") + " " + (h.zh||"")).toLowerCase(); });
    PLACES.forEach(function (p) { by[p.id] = ((p.name_ru||"") + " " + (p.name_en||"") + " " + (p.zh||"") + " " + (p.section||"") + " " + (p.group||"") + " " + (p.about||"")).toLowerCase(); });
    document.querySelectorAll("#list-hotels .list-item, #list-places .list-item, #list-shops .list-item").forEach(function (el) {
      var s = by[el.dataset.id] || el.textContent.toLowerCase();
      el.style.display = (!q || s.indexOf(q) >= 0) ? "" : "none";
    });
    if (q) {
      document.querySelectorAll("#list-hotels, #list-places, #list-shops, #panel-explore .grp-items").forEach(function (c) { c.style.display = ""; });
      document.querySelectorAll("#panel-explore .collapsible").forEach(function (el) { el.classList.remove("collapsed"); });
    }
    var rc = document.getElementById("search-rest");
    if (rc) {
      if (q) {
        var hits = RESTAURANTS.map(function (r, i) { return { r: r, i: i }; }).filter(function (o) {
          return ((o.r.name_ru||"") + " " + (o.r.name_en||"") + " " + (o.r.zh||"") + " " + (o.r.cuisine||"")).toLowerCase().indexOf(q) >= 0;
        });
        rc.innerHTML = hits.length ? '<div class="section-label">🍜 Рестораны (' + hits.length + ')</div>' + hits.map(function (o) {
          var r = o.r;
          return '<div class="list-item" onclick="__openRestIdx(' + o.i + ')"><div class="li-pin" style="background:' + CATS.food.color + '"><span>🍜</span></div>' +
            '<div class="li-body"><div class="li-title">' + r.name_ru + '</div>' + (r.zh ? '<div class="li-zh">' + r.zh + '</div>' : '') +
            '<div class="li-meta">' + (r.cuisine || "") + (r.zoneLabel ? ' · ' + r.zoneLabel : "") + '</div></div></div>';
        }).join("") : '<div class="section-label">🍜 Рестораны</div><div class="est-note" style="padding:0 2px">Ничего не найдено</div>';
      } else rc.innerHTML = "";
    }
  };

  /* ---------------- Сравнение отелей ---------------- */
  window.__compareHotels = function () {
    var cheapest = Infinity, topR = 0;
    HOTELS.forEach(function (h) {
      if (h.priceFrom && h.priceFrom < cheapest) cheapest = h.priceFrom;
      var r = (h.rating && h.rating[0]) ? parseFloat(h.rating[0].score) : 0;
      if (r > topR) topR = r;
    });
    var rows = HOTELS.slice().sort(function (a, b) { return (a.priceFrom || 1e9) - (b.priceFrom || 1e9); }).map(function (h) {
      var r = (h.rating && h.rating[0]) ? parseFloat(h.rating[0].score) : 0;

          { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 });
      } else if (err && err.code === 1) {          // PERMISSION_DENIED
        fail("Доступ к геопозиции этому приложению не выдан.");
      } else {
        fail("Не удалось определить местоположение автоматически.");
      }
    };
    navigator.geolocation.getCurrentPosition(onOk, onErr, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  }
  function turnGeoOff(btn) {
    stopManualPick();
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
    geoOn = false; geoLatLng = null; geoStation = null;
    btn.classList.remove("active"); btn.title = "Моё местоположение (или указать вручную по карте)";
    // если старт метро/такси был «от меня» — вернуть на видимый отель
    if (originState.type === "geo") {
      var v = visibleHotels();
      originState = { type: "hotel", hotelId: (v[0] || HOTELS[0] || {}).id };
      refreshMetro();
    }
  }

  /* ---------------- UI-обвязка ---------------- */
  function wireUI() {
    document.querySelectorAll(".tab").forEach(function (t) {
      t.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
        document.querySelectorAll(".panel").forEach(function(x){x.classList.remove("active");});
        t.classList.add("active");
        document.getElementById("panel-" + t.dataset.panel).classList.add("active");
      });
    });
    document.querySelectorAll(".layer-switch button").forEach(function (b) {
      b.addEventListener("click", function () { setBase(b.dataset.base); });
    });
    document.getElementById("btn-geo").addEventListener("click", toggleGeo);
    map.on("click", function (e) { if (manualPick) { stopManualPick(); applyGeo([e.latlng.lat, e.latlng.lng], null, true); } });
    document.getElementById("btn-fit").addEventListener("click", function () {
      var all = HOTELS.concat(PLACES).map(function(x){return [x.lat,x.lng];});
      map.fitBounds(all, { padding: [50,50] });
    });
    var lb = document.getElementById("btn-labels");
    if (lb) lb.addEventListener("click", function () {
      var on = map.getContainer().classList.toggle("labels-all");
      lb.classList.toggle("active", on);
    });
    var ab = document.getElementById("btn-areas");
    if (ab) { ab.classList.add("active"); ab.addEventListener("click", function () {
      areasOn = !areasOn; ab.classList.toggle("active", areasOn); updateAreaVisibility();
    }); }
    var db = document.getElementById("btn-dark");
    if (db) db.addEventListener("click", function () {
      darkMode = !darkMode;
      document.documentElement.classList.toggle("dark", darkMode);
      db.textContent = darkMode ? "☀️" : "🌙";
      db.classList.toggle("active", darkMode);
      if (currentBase === "voyager") setBase("voyager");
    });
    document.querySelectorAll(".chip").forEach(function (c) {
      c.addEventListener("click", function () {
        c.classList.toggle("off");
        toggleCat(c.dataset.cat, !c.classList.contains("off"));
      });
    });
    var ps = document.getElementById("phrase-search");
    if (ps) ps.addEventListener("input", function () { buildPhrases(ps.value); });
    document.getElementById("menu-btn").addEventListener("click", function () {
      document.getElementById("sidebar").classList.toggle("open");
    });
    var sc = document.getElementById("sidebar-close");
    if (sc) sc.addEventListener("click", function () { document.getElementById("sidebar").classList.remove("open"); });
  }

  /* ---------------- Инициализация ---------------- */
  addMarkers();
  applyHotelVis();
  buildAreas();
  buildTrip();
  buildWeather();
  buildLists();
  buildTickets();
  buildPhrases("");
  wireUI();
  setBase("voyager");
  var all = HOTELS.concat(PLACES).map(function(x){return [x.lat,x.lng];});
  if (all.length) map.fitBounds(all, { padding: [60,60] });

  /* ---------------- PWA: установка на телефон + офлайн ---------------- */
  (function pwa() {
    var standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone) document.documentElement.classList.add("standalone");

    // Регистрация service worker (только по http/https — из локального файла работать не будет)
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    // Подсказка по установке на iOS (в Safari «Добавить на экран Домой» вручную)
    var ua = navigator.userAgent || "";
    var isIOSdev = /iP(hone|ad|od)/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
    try {
      if (isIOSdev && isSafari && !standalone && location.protocol !== "file:" &&
          localStorage.getItem("gz_install_hint") !== "off") {
        var b = document.createElement("div");
        b.className = "ios-install";
        b.innerHTML =
          '<button class="ios-x" aria-label="Закрыть">×</button>' +
          '<div class="ios-ic">🏮</div>' +
          '<div class="ios-tx"><b>Установите как приложение</b>' +
          '<span>Нажмите <b>Поделиться</b> <svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px"><path fill="currentColor" d="M12 3l4 4-1.4 1.4L13 6.8V15h-2V6.8L9.4 8.4 8 7l4-4zm-7 9h2v7h10v-7h2v7c0 1.1-.9 2-2 2H7a2 2 0 0 1-2-2v-7z"/></svg>' +
          ' → <b>«На экран „Домой“»</b></span></div>';
        document.body.appendChild(b);
        var hide = function () { b.classList.remove("show"); setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 300); };
        b.querySelector(".ios-x").addEventListener("click", function () { localStorage.setItem("gz_install_hint", "off"); hide(); });
        setTimeout(function () { b.classList.add("show"); }, 900);
        setTimeout(hide, 15000);
      }
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
